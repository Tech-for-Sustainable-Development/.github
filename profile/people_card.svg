<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 390"
     width="1080"
     height="390"
     role="img"
     aria-labelledby="title desc">

  <title id="title">TSDN Contributors and Community</title>
  <desc id="desc">
    TSDN profile card distinguishing GitHub contributors from non-code community contributors.
  </desc>

  <defs>

    <style>
      .sans {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
      }

      .eyebrow {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2.2px;
        fill: #707a72;
      }

      .name {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #f1f0e8;
      }

      .role {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #707a72;
      }

      .type {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 1.1px;
        fill: #4f5b53;
      }

      .card {
        fill: #0d120f;
        stroke: #29332d;
        stroke-width: 1;
      }

      .connector {
        fill: none;
        stroke: #344139;
        stroke-width: 1;
      }

      .connector-active {
        fill: none;
        stroke: #55a879;
        stroke-width: 1;
        stroke-dasharray: 3 10;
        animation: travel 10s linear infinite;
      }

      .ring {
        fill: none;
        stroke-width: 1;
        opacity: .6;
      }

      .plus {
        fill: none;
        stroke: #55a879;
        stroke-width: 1;
      }

      @keyframes travel {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -130; }
      }

      @media (prefers-reduced-motion: reduce) {
        .connector-active {
          animation: none;
        }
      }
    </style>

    <clipPath id="p1">
      <circle cx="110" cy="158" r="42"/>
    </clipPath>

    <clipPath id="p2">
      <circle cx="305" cy="158" r="42"/>
    </clipPath>

    <clipPath id="p3">
      <circle cx="500" cy="158" r="42"/>
    </clipPath>

    <clipPath id="p4">
      <circle cx="695" cy="158" r="42"/>
    </clipPath>

    <clipPath id="p5">
      <circle cx="890" cy="158" r="42"/>
    </clipPath>

  </defs>


  <!-- CARD -->

  <rect x="0.5"
        y="0.5"
        width="1079"
        height="389"
        rx="18"
        class="card"/>


  <!-- HEADER -->

  <text x="48" y="50" class="eyebrow">
    TSDN / PEOPLE
  </text>

  <text x="1032" y="50"
        text-anchor="end"
        class="eyebrow">
    CODE + COMMUNITY
  </text>


  <!-- CONNECTIONS -->

  <path d="M152 158 H263
           M347 158 H458
           M542 158 H653
           M737 158 H848"
        class="connector"/>

  <path d="M152 158 H263
           M347 158 H458
           M542 158 H653
           M737 158 H848"
        class="connector-active"/>


  <!-- PHONE-METAL / GITHUB CONTRIBUTOR -->

  <g>

    <circle cx="110" cy="158" r="47"
            class="ring"
            stroke="#55a879"/>

    <circle cx="110" cy="158" r="42"
            fill="#263c31"
            stroke="#29332d"
            stroke-width="2"/>

    <g clip-path="url(#p1)">
      <rect x="68" y="116" width="84" height="84" fill="#263c31"/>

      <circle cx="110" cy="147"
              r="15"
              fill="#6d927b"/>

      <path d="M78 202
               C81 169 94 160 110 160
               C126 160 139 169 142 202"
            fill="#365744"/>

      <path d="M68 131
               C88 120 128 120 154 134"
            fill="none"
            stroke="#b5c493"
            stroke-width="1"
            opacity=".5"/>
    </g>

    <circle cx="141" cy="190"
            r="4"
            fill="#d5df69"/>

    <text x="110" y="228"
          text-anchor="middle"
          class="name">
      @Phone-Metal
    </text>

    <text x="110" y="247"
          text-anchor="middle"
          class="role">
      Contributor
    </text>

    <text x="110" y="266"
          text-anchor="middle"
          class="type">
      GITHUB / CODE
    </text>

  </g>


  <!-- MALWINA / COMMUNITY CONTRIBUTOR -->

  <g>

    <circle cx="305" cy="158" r="47"
            class="ring"
            stroke="#9b8f72"/>

    <circle cx="305" cy="158" r="42"
            fill="#39362c"
            stroke="#29332d"
            stroke-width="2"/>

    <g clip-path="url(#p2)">
      <rect x="263" y="116" width="84" height="84" fill="#39362c"/>

      <circle cx="305" cy="147"
              r="15"
              fill="#a99d7e"/>

      <path d="M273 202
               C277 169 289 160 305 160
               C321 160 333 169 337 202"
            fill="#5a5341"/>

      <path d="M264 143
               C283 129 324 130 346 146"
            fill="none"
            stroke="#c7bd9c"
            stroke-width="1"
            opacity=".45"/>
    </g>

    <text x="305" y="228"
          text-anchor="middle"
          class="name">
      Malwina
    </text>

    <text x="305" y="247"
          text-anchor="middle"
          class="role">
      Contributor
    </text>

    <text x="305" y="266"
          text-anchor="middle"
          class="type">
      COMMUNITY / NON-CODE
    </text>

  </g>


  <!-- SOCXENOPHONE / GITHUB CONTRIBUTOR -->

  <g>

    <circle cx="500" cy="158" r="47"
            class="ring"
            stroke="#7f9aa0"/>

    <circle cx="500" cy="158" r="42"
            fill="#28363a"
            stroke="#29332d"
            stroke-width="2"/>

    <g clip-path="url(#p3)">
      <rect x="458" y="116" width="84" height="84" fill="#28363a"/>

      <circle cx="500" cy="147"
              r="15"
              fill="#78979a"/>

      <path d="M468 202
               C472 169 484 160 500 160
               C516 160 528 169 532 202"
            fill="#3d5558"/>

      <path d="M459 128
               C481 139 517 137 541 124"
            fill="none"
            stroke="#a7c1bd"
            stroke-width="1"
            opacity=".45"/>
    </g>

    <text x="500" y="228"
          text-anchor="middle"
          class="name">
      @Socxenophone
    </text>

    <text x="500" y="247"
          text-anchor="middle"
          class="role">
      Contributor
    </text>

    <text x="500" y="266"
          text-anchor="middle"
          class="type">
      GITHUB / CODE
    </text>

  </g>


  <!-- UMOGAL / GITHUB CONTRIBUTOR -->

  <g>

    <circle cx="695" cy="158" r="47"
            class="ring"
            stroke="#8e8b6d"/>

    <circle cx="695" cy="158" r="42"
            fill="#36382c"
            stroke="#29332d"
            stroke-width="2"/>

    <g clip-path="url(#p4)">
      <rect x="653" y="116" width="84" height="84" fill="#36382c"/>

      <circle cx="695" cy="147"
              r="15"
              fill="#98946f"/>

      <path d="M663 202
               C667 169 679 160 695 160
               C711 160 723 169 727 202"
            fill="#50513b"/>

      <path d="M655 155
               C675 145 714 144 736 158"
            fill="none"
            stroke="#c4c28e"
            stroke-width="1"
            opacity=".4"/>
    </g>

    <text x="695" y="228"
          text-anchor="middle"
          class="name">
      @umogal
    </text>

    <text x="695" y="247"
          text-anchor="middle"
          class="role">
      Contributor
    </text>

    <text x="695" y="266"
          text-anchor="middle"
          class="type">
      GITHUB / CODE
    </text>

  </g>


  <!-- ALEXI / COMMUNITY CONTRIBUTOR -->

  <g>

    <circle cx="890" cy="158" r="47"
            class="ring"
            stroke="#806f82"/>

    <circle cx="890" cy="158" r="42"
            fill="#342d36"
            stroke="#29332d"
            stroke-width="2"/>

    <g clip-path="url(#p5)">
      <rect x="848" y="116" width="84" height="84" fill="#342d36"/>

      <circle cx="890" cy="147"
              r="15"
              fill="#917d91"/>

      <path d="M858 202
               C862 169 874 160 890 160
               C906 160 918 169 922 202"
            fill="#4e4150"/>

      <path d="M849 136
               C870 124 907 124 931 139"
            fill="none"
            stroke="#b9a8b9"
            stroke-width="1"
            opacity=".4"/>
    </g>

    <text x="890" y="228"
          text-anchor="middle"
          class="name">
      Alexi "Dunross"
    </text>

    <text x="890" y="247"
          text-anchor="middle"
          class="role">
      Contributor
    </text>

    <text x="890" y="266"
          text-anchor="middle"
          class="type">
      COMMUNITY / NON-CODE
    </text>

  </g>


  <!-- JOIN -->

  <g>

    <circle cx="1000"
            cy="158"
            r="30"
            fill="#101711"
            stroke="#29332d"
            stroke-width="1"/>

    <circle cx="1000"
            cy="158"
            r="21"
            class="plus"/>

    <path d="M991 158 H1009
             M1000 149 V167"
          stroke="#d5df69"
          stroke-width="1.2"
          stroke-linecap="round"/>

    <text x="1000"
          y="228"
          text-anchor="middle"
          class="name"
          fill="#d5df69">
      JOIN US
    </text>

    <text x="1000"
          y="247"
          text-anchor="middle"
          class="role">
      Add yours
    </text>

  </g>


  <!-- FOOTER -->

  <line x1="48"
        y1="300"
        x2="1032"
        y2="300"
        class="fine"/>

  <text x="48"
        y="330"
        class="small">
    CODE CONTRIBUTORS
  </text>

  <text x="210"
        y="330"
        class="small">
    @Phone-Metal · @Socxenophone · @umogal
  </text>

  <text x="1032"
        y="330"
        text-anchor="end"
        class="small">
    GITHUB
  </text>

  <text x="48"
        y="356"
        class="small">
    COMMUNITY CONTRIBUTORS
  </text>

  <text x="250"
        y="356"
        class="small">
    Malwina · Alexi "Dunross"
  </text>

  <text x="1032"
        y="356"
        text-anchor="end"
        class="small">
    NON-CODE
  </text>

</svg>
