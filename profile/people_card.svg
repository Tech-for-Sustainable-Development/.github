<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 390"
     width="1080"
     height="390"
     role="img"
     aria-labelledby="title desc">

  <title id="title">TSDGN Contributors</title>
  <desc id="desc">
    Technology for Sustainable Development & Growth Network contributor chain,
    showing code and community contributors with an invitation to join.
  </desc>

  <style>
    :root {
      color-scheme: dark;
    }

    svg {
      background: #090d0b;
    }

    .bg { fill: #090d0b; }
    .card { fill: #0d120f; }
    .ink {
      fill: #f1f0e8;
      font-family: Georgia, "Times New Roman", serif;
    }
    .text {
      fill: #b2b9b1;
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    .muted {
      fill: #707a72;
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    .line {
      stroke: #29332d;
      stroke-width: 1;
    }
    .green { fill: #55a879; }
    .lime { fill: #d5df69; }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }

    .person {
      font-size: 18px;
      font-weight: 600;
    }

    .role {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.1px;
    }

    .type {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
    }

    .footer {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .6px;
    }

    .join-main {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .join-sub {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .connector {
      fill: none;
      stroke: #29332d;
      stroke-width: 1;
    }

    .connector-active {
      fill: none;
      stroke: #55a879;
      stroke-width: 2;
      stroke-dasharray: 4 12;
      stroke-linecap: round;
      animation: travel 15s linear infinite;
    }

    .avatar-inner {
      stroke: #090d0b;
      stroke-width: 1;
    }

    @keyframes travel {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -250; }
    }

    @media (prefers-reduced-motion: reduce) {
      .connector-active {
        animation: none;
      }
      * {
        animation-play-state: paused !important;
      }
    }
  </style>

  <!-- DARK MODE BACKGROUND -->
  <rect class="bg" x="0" y="0" width="1080" height="390"/>

  <!-- CARD -->
  <rect class="card"
        x="24"
        y="24"
        width="1032"
        height="342"
        rx="18"
        stroke="#29332d"
        stroke-width="1"/>

  <!-- HEADER -->
  <text x="58" y="62" class="text eyebrow"> PEOPLE @Tech SDG Network</text>
  <text x="1022" y="62"
        text-anchor="end"
        class="muted eyebrow"> Code + Community </text>

  <line x1="58" y1="82" x2="1022" y2="82" class="line"/>

  <!-- CONNECTOR BASE -->
  <path
    d="M110 158
       C175 158 240 158 305 158
       C370 158 435 158 500 158
       C565 158 630 158 695 158
       C760 158 825 158 890 158
       C925 158 965 158 1000 158"
    class="connector"/>

  <!-- CONNECTOR ACTIVE -->
  <path
    d="M110 158
       C175 158 240 158 305 158
       C370 158 435 158 500 158
       C565 158 630 158 695 158
       C760 158 825 158 890 158
       C925 158 965 158 1000 158"
    class="connector-active"/>

  <!-- PHONE-METAL -->
  <g>
    <!-- Floating Node Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5s" begin="0s" repeatCount="indefinite"/>
    
    <!-- Hide line behind avatar -->
    <circle cx="110" cy="158" r="43" fill="#0d120f"/>
    
    <!-- Rotating Tech Ring -->
    <circle cx="110" cy="158" r="43" fill="none" stroke="#55a879" stroke-width="1.5" stroke-dasharray="70 20 10 20" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 110 158; 360 110 158" dur="25s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="110" cy="158" r="35" class="avatar-inner" fill="#173526"/>
    
    <!-- Clean User Icon -->
    <circle cx="110" cy="147" r="10" fill="#55a879" opacity="0.9"/>
    <path d="M 84,185 C 84,162 136,162 136,185 Z" fill="#55a879" opacity="0.7"/>

    <text x="110" y="222" text-anchor="middle" class="ink person">@Phone-Metal</text>
    <text x="110" y="244" text-anchor="middle" class="muted role">Contributor</text>
    <text x="110" y="263" text-anchor="middle" class="green type">GITHUB / CODE</text>
  </g>

  <!-- MALWINA -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5.5s" begin="-1s" repeatCount="indefinite"/>
    
    <circle cx="305" cy="158" r="43" fill="#0d120f"/>
    <circle cx="305" cy="158" r="43" fill="none" stroke="#8b8a5c" stroke-width="1.5" stroke-dasharray="70 20 10 20" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="360 305 158; 0 305 158" dur="28s" repeatCount="indefinite"/>
    </circle>

    <circle cx="305" cy="158" r="35" class="avatar-inner" fill="#353421"/>
    
    <!-- Clean User Icon -->
    <circle cx="305" cy="147" r="10" fill="#a69d68" opacity="0.9"/>
    <path d="M 279,185 C 279,162 331,162 331,185 Z" fill="#a69d68" opacity="0.7"/>

    <text x="305" y="222" text-anchor="middle" class="ink person">Malwina</text>
    <text x="305" y="244" text-anchor="middle" class="muted role">Contributor</text>
    <text x="305" y="263" text-anchor="middle" class="lime type">COMMUNITY / NON-CODE</text>
  </g>

  <!-- SOCXENOPHONE -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.8s" begin="-2.5s" repeatCount="indefinite"/>
    
    <circle cx="500" cy="158" r="43" fill="#0d120f"/>
    <circle cx="500" cy="158" r="43" fill="none" stroke="#607782" stroke-width="1.5" stroke-dasharray="70 20 10 20" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 500 158; 360 500 158" dur="22s" repeatCount="indefinite"/>
    </circle>

    <circle cx="500" cy="158" r="35" class="avatar-inner" fill="#26343a"/>
    
    <!-- Clean User Icon -->
    <circle cx="500" cy="147" r="10" fill="#8199a2" opacity="0.9"/>
    <path d="M 474,185 C 474,162 526,162 526,185 Z" fill="#8199a2" opacity="0.7"/>

    <text x="500" y="222" text-anchor="middle" class="ink person">@Socxenophone</text>
    <text x="500" y="244" text-anchor="middle" class="muted role">Contributor</text>
    <text x="500" y="263" text-anchor="middle" class="green type">GITHUB / CODE</text>
  </g>

  <!-- UMOGAL -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5.2s" begin="-1.8s" repeatCount="indefinite"/>
    
    <circle cx="695" cy="158" r="43" fill="#0d120f"/>
    <circle cx="695" cy="158" r="43" fill="none" stroke="#7f8754" stroke-width="1.5" stroke-dasharray="70 20 10 20" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="360 695 158; 0 695 158" dur="26s" repeatCount="indefinite"/>
    </circle>

    <circle cx="695" cy="158" r="35" class="avatar-inner" fill="#303523"/>
    
    <!-- Clean User Icon -->
    <circle cx="695" cy="147" r="10" fill="#a5ad65" opacity="0.9"/>
    <path d="M 669,185 C 669,162 721,162 721,185 Z" fill="#a5ad65" opacity="0.7"/>

    <text x="695" y="222" text-anchor="middle" class="ink person">@umogal</text>
    <text x="695" y="244" text-anchor="middle" class="muted role">Contributor</text>
    <text x="695" y="263" text-anchor="middle" class="green type">GITHUB / CODE</text>
  </g>

  <!-- ALEXI -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.5s" begin="-3.2s" repeatCount="indefinite"/>
    
    <circle cx="890" cy="158" r="43" fill="#0d120f"/>
    <circle cx="890" cy="158" r="43" fill="none" stroke="#806b7c" stroke-width="1.5" stroke-dasharray="70 20 10 20" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 890 158; 360 890 158" dur="24s" repeatCount="indefinite"/>
    </circle>

    <circle cx="890" cy="158" r="35" class="avatar-inner" fill="#352b34"/>
    
    <!-- Clean User Icon -->
    <circle cx="890" cy="147" r="10" fill="#a4869a" opacity="0.9"/>
    <path d="M 864,185 C 864,162 916,162 916,185 Z" fill="#a4869a" opacity="0.7"/>

    <text x="890" y="222" text-anchor="middle" class="ink person">Alexi "Dunross"</text>
    <text x="890" y="244" text-anchor="middle" class="muted role">Contributor</text>
    <text x="890" y="263" text-anchor="middle" class="lime type">COMMUNITY / NON-CODE</text>
  </g>

  <!-- JOIN NODE -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" begin="-0.5s" repeatCount="indefinite"/>
    
    <!-- Outer Ping Animation -->
    <circle cx="1000" cy="158" r="30" fill="none" stroke="#55a879" stroke-width="1.5">
      <animate attributeName="r" values="30; 38; 30" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1; 0; 1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1000" cy="158" r="30" fill="#0d120f" stroke="#55a879" stroke-width="1.5"/>
    
    <circle cx="1000" cy="158" r="5" fill="#d5df69">
      <animate attributeName="r" values="4; 7; 4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="1000" y="210" text-anchor="middle" class="lime join-main">JOIN US</text>
    <text x="1000" y="228" text-anchor="middle" class="muted join-sub">Add yours</text>
  </g>

  <!-- FOOTER -->
  <line x1="58" y1="296" x2="1022" y2="296" class="line"/>

  <text x="58" y="324" class="text footer">
    <tspan class="green">CODE CONTRIBUTORS</tspan>
    <tspan> — @Phone-Metal · @Socxenophone · @umogal</tspan>
    <tspan class="muted"> — GITHUB</tspan>
  </text>

  <text x="58" y="347" class="text footer">
    <tspan class="lime">COMMUNITY CONTRIBUTORS</tspan>
    <tspan> — Malwina · Alexi "Dunross"</tspan>
    <tspan class="muted"> — NON-CODE</tspan>
  </text>

</svg>
